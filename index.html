      color: lime;
      text-shadow: 3px 3px red, -3px -3px blue;
      animation: flashBg 0.3s infinite alternate;
      overflow: hidden;
    }

    @keyframes flashBg {
      0% { background: url('https://media.giphy.com/media/LbwJp26pqGf0k/giphy.gif') repeat; }
      25% { background: url('https://media.giphy.com/media/26BRq7Rz8P9BTi1yY/giphy.gif') repeat; }
      50% { background: url('https://media.giphy.com/media/xT0xeJpnrWC4XWblEk/giphy.gif') repeat; }
      75% { background: url('https://media.giphy.com/media/l3q2K5jinAlChoCLS/giphy.gif') repeat; }
      100% { background: url('https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif') repeat; }
    }

    .marquee {
      width: 100%;
      background: yellow;
      color: red;
      font-weight: bold;
      position: fixed;
      top: 0;
      left: 0;
      white-space: nowrap;
      overflow: hidden;
      z-index: 9999;
      font-size: 24px;
    }

    .marquee span {
      display: inline-block;
      padding-left: 100%;
      animation: marquee 5s linear infinite;
    }

    @keyframes marquee {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-100%, 0); }
    }

    img.chaotic {
      position: absolute;
      width: 150px;
      animation: spin 2s linear infinite, bounce 1s infinite alternate;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes bounce {
      0% { top: 0%; left: 0%; }
      100% { top: 80%; left: 80%; }
    }

    button {
      display: block;
      margin: 20px auto;
      padding: 20px;
      font-size: 36px;
      background-color: yellow;
      color: red;
      border: 10px dashed magenta;
      text-shadow: 2px 2px black;
      cursor: pointer;
      animation: flashBtn 0.2s infinite alternate;
    }

    @keyframes flashBtn {
      0% { background-color: yellow; color: red; }
      100% { background-color: red; color: yellow; }
    }

    .explosion {
      position: absolute;
      width: 200px;
      animation: explode 1s ease-in-out forwards;
    }

    @keyframes explode {
      0% { transform: scale(0); opacity: 0; }
      50% { transform: scale(1.5); opacity: 1; }
      100% { transform: scale(0); opacity: 0; }
    }

    .trex {
      position: absolute;
      width: 300px;
      left: -400px;
      animation: trexIn 5s linear infinite;
    }

    @keyframes trexIn {
      0% { left: -400px; transform: rotate(0deg); }
      50% { left: 50%; transform: rotate(5deg); }
      100% { left: 120%; transform: rotate(-5deg); }
    }

    @keyframes shake {
      0% { transform: translate(0px, 0px); }
      25% { transform: translate(5px, -5px); }
      50% { transform: translate(-5px, 5px); }
      75% { transform: translate(5px, 5px); }
      100% { transform: translate(0px, 0px); }
    }

    .willsmith {
      position: absolute;
      width: 200px;
      top: 40%;
      left: 40%;
      opacity: 0;
      animation: fadeInSpin 4s ease-in-out infinite;
    }

    @keyframes fadeInSpin {
      0% { opacity: 0; transform: rotate(0deg); }
      25% { opacity: 1; transform: rotate(90deg); }
      50% { opacity: 1; transform: rotate(180deg); }
      75% { opacity: 1; transform: rotate(270deg); }
      100% { opacity: 0; transform: rotate(360deg); }
    }
  </style>
