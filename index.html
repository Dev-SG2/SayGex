<!DOCTYPE html>

      font-family: Comic Sans MS, cursive, sans-serif;
      color: lime;
      text-shadow: 2px 2px red;
      animation: flashBg 0.5s infinite alternate;
    }
    @keyframes flashBg {
      from { background-color: magenta; }
      to { background-color: cyan; }
    }
    .marquee {
      width: 100%;
      background: yellow;
      color: red;
      font-weight: bold;
      position: fixed;
      top: 0;
      left: 0;
      white-space: nowrap;
      overflow: hidden;
      z-index: 9999;
    }
    .marquee span {
      display: inline-block;
      padding-left: 100%;
      animation: marquee 10s linear infinite;
    }
    @keyframes marquee {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-100%, 0); }
    }
    img {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(360deg);
      animation: spin 2s linear infinite;
    }
    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
    button {
      display: block;
      margin: 20px auto;
      padding: 20px;
      font-size: 24px;
      background-color: yellow;
      color: red;
      border: 5px solid magenta;
      text-shadow: 1px 1px black;
      cursor: pointer;
      animation: flashBtn 0.4s infinite alternate;
    }
    @keyframes flashBtn {
      from { background-color: yellow; }
      to { background-color: red; color: yellow; }
    }
  </style>
</head>
